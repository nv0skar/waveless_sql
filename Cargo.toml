[package]
name = "waveless_sql"
description = "Waveless' MySQL and PostgreSQL support."
version = "0.0.1"
homepage = "https://github.com/nv0skar/waveless_sql"
repository = "https://github.com/nv0skar/waveless_sql"
edition = "2024"

[dependencies]
rustyrosetta = { git = "https://github.com/nv0skar/RustyRosetta.git", tag = "rustyrosetta_0.0.4", features = [
    "all",
] }

waveless_commons = { git = "https://github.com/nv0skar/Waveless.git" }

tokio = "1.53"

tokio-util = "0.7"

tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false }

futures = "0.3"

serde = { version = "1.0.229", features = ["derive", "rc"] }
toml = "1.1.3"
serde_json = "1.0"
serde_with = { version = "3.21", features = ["chrono"] }

hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.5.3", features = ["full"] }
tower-http = "0.7"
tower-http-cache = "0.5.0"
tower_governor = { git = "https://github.com/nv0skar/tower-governor-generic-result.git", default-features = false }
http = "1.4.2"
matchit = "0.9.2"

tungstenite = "0.30"
hyper-tungstenite = "0.30"

bytes = "1.12"

sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "json",
    "mysql",
    "postgres"
] }
sea-orm = { version = "2.0.2", features = [ "runtime-tokio-rustls", "schema-sync", "sqlx-mysql", "sqlx-postgres" ] }
sea-schema = { git = "https://github.com/nv0skar/sea-schema-mysql.git", features = [
    "runtime-tokio",
    "runtime-tokio-rustls",
    "sqlx-all",
] }

chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "serde",
] }

typetag = "0.2"
async-trait = "0.1"
dyn-clone = "1.0.20"

struct-patch = "0.13"
garde = { version = "0.23", features = ["full"] }
half = { version = "2.7", features = ["serde"] }
rust_decimal = "1.42"
email_address = "0.2"

smallvec = { version = "1.15", features = ["serde", "write", "const_new"] }
arrayvec = { version = "0.7", features = ["serde"] }
stackalloc = "1"
smallbox = "0.8"
rclite = "0.4"
flume = "0.12"
dashmap = { version = "6.2", features = ["serde"] }
compact_str = { version = "0.10", features = ["serde"] }

mimalloc = { version = "0.1.52", features = ["secure"] }

rand = "0.10"

blake3 = "1.8"
argon2 = { version = "0.5", default-features = true }
crc32fast = "1.5"

clap = { version = "4.6", features = ["derive"] }

iocraft = "0.8"
owo-colors = "4.3"

regex = "1.13"

# wasm-bindgen = "0.2.100"

dotenvy = "0.15"
dotenvy_macro = "0.15"

tracing = "0.1"
tracing-subscriber = "0.3"
console-subscriber = "0.5"
tracing-appender = "0.2"

hex = "0.4"
itertools = "0.15"

getset = "0.1"
nestify = "0.3"
either = { version = "1.16", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0.19"
derive_builder = "0.20"
derive_more = { version = "2.1", features = ["constructor", "display"] }

[workspace.lints.rust]
unexpected_cfgs = "deny"

[profile.dev.package."*"]
debug = false
codegen-units = 256
opt-level = 's'

[profile.release]
debug = false
strip = true
codegen-units = 256
lto = true
opt-level = 's'
